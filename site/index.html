<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ef">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Amy's Ring</title>
  <script type="module" src="./model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #f4f2ef;
      --ink: #2c2a27;
      --muted: #6b6862;
      --line: rgba(44, 42, 39, 0.14);
      --panel: rgba(255, 255, 253, 0.82);
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --safe-top: max(16px, env(safe-area-inset-top));
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
      --safe-left: max(16px, env(safe-area-inset-left));
      --safe-right: max(16px, env(safe-area-inset-right));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    model-viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      --poster-color: var(--bg);
    }

    header {
      position: fixed;
      top: var(--safe-top);
      left: var(--safe-left);
      right: var(--safe-right);
      z-index: 2;
      text-align: center;
      pointer-events: none;
    }

    #site-title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(1.15rem, 3.6vw, 1.65rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 72px);
      transform: translateX(-50%);
      z-index: 2;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .hint.is-hidden { opacity: 0; }

    .chrome {
      position: fixed;
      left: var(--safe-left);
      right: var(--safe-right);
      bottom: var(--safe-bottom);
      z-index: 3;
      display: flex;
      align-items: flex-end;
      gap: 0.55rem;
      pointer-events: none;
    }

    .chrome > * { pointer-events: auto; }

    #reset {
      appearance: none;
      flex-shrink: 0;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.7rem 0.95rem;
      font: 500 0.72rem/1 var(--sans);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      white-space: nowrap;
    }

    #reset:hover { border-color: rgba(44, 42, 39, 0.35); }
    #reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .specs {
      flex: 1;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .specs summary {
      list-style: none;
      cursor: pointer;
      padding: 0.7rem 0.95rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      user-select: none;
    }

    .specs summary::-webkit-details-marker { display: none; }

    .specs summary::after {
      content: "▾";
      font-size: 0.85rem;
      line-height: 1;
      color: var(--ink);
      transform: none;
      margin: 0;
    }

    .specs[open] summary::after {
      content: "▴";
    }

    .specs summary:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 14px; }

    .spec-body {
      border-top: 1px solid var(--line);
      padding: 0.75rem 0.95rem 0.9rem;
    }

    .spec-body dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.45rem 0.9rem;
      font-size: 0.8rem;
      line-height: 1.35;
    }

    .spec-body dt {
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .spec-body dd { font-weight: 400; }

    .progress {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: min(9.5rem, 46vw);
      pointer-events: none;
    }

    .progress.is-hidden {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .progress-label {
      display: block;
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.55rem;
    }

    .progress-track {
      height: 1px;
      background: rgba(44, 42, 39, 0.12);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      background: var(--ink);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.16s linear;
    }

    @media (min-width: 800px) {
      #site-title { letter-spacing: 0.18em; }

      model-viewer {
        top: 5.25rem;
      }

      .hint {
        bottom: auto;
        top: calc(var(--safe-top) + 2.55rem);
      }

      .specs {
        flex: 0 1 28rem;
      }

      .chrome {
        justify-content: space-between;
      }

      .spec-body dl {
        font-size: 0.84rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="site-title">Amy's Ring</h1>
  </header>

  <model-viewer
    id="viewer"
    src="./ring.glb"
    alt="Interactive 3D ring"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="2500"
    rotation-per-second="16deg"
    interaction-prompt="none"
    environment-image="neutral"
    tone-mapping="commerce"
    shadow-intensity="0.8"
    shadow-softness="0.95"
    exposure="1.08"
    camera-orbit="-40deg 70deg 125%"
    field-of-view="22deg"
    min-field-of-view="12deg"
    max-field-of-view="45deg"
    interpolation-decay="90"
    loading="eager"
  >
    <div class="progress" slot="progress-bar" id="progress">
      <span class="progress-label">Loading</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </model-viewer>

  <p class="hint" id="hint">Drag to rotate - pinch to zoom</p>

  <footer class="chrome">
    <details class="specs" id="specs">
      <summary>Details</summary>
      <div class="spec-body">
        <dl>
          <dt>Metal</dt>
          <dd>18K White Gold</dd>
          <dt>Weight</dt>
          <dd>approx. 8.2 g</dd>
          <dt>Size</dt>
          <dd>5.5</dd>
          <dt>Center</dt>
          <dd>15.68 ct lab-grown oval, D color, VVS1, IGI LG843655695</dd>
          <dt>Accents</dt>
          <dd>approx. 4.35 ct total</dd>
        </dl>
      </div>
    </details>
    <button type="button" id="reset">Reset view</button>
  </footer>

  <script>
    // One easy-to-edit title. Change this string only.
    const SITE_TITLE = "Amy's Ring";

    const DEFAULT_FOV = "22deg";

    function defaultOrbit() {
      return "-40deg 70deg 125%";
    }

    const titleEl = document.getElementById("site-title");
    titleEl.textContent = SITE_TITLE;
    document.title = SITE_TITLE;

    const viewer = document.getElementById("viewer");
    const progress = document.getElementById("progress");
    const progressFill = document.getElementById("progress-fill");
    const hint = document.getElementById("hint");
    const specs = document.getElementById("specs");

    if (window.matchMedia("(min-width: 800px)").matches) {
      specs.open = true;
    }

    viewer.cameraOrbit = defaultOrbit();

    viewer.addEventListener("progress", (event) => {
      const amount = event.detail.totalProgress;
      progressFill.style.transform = "scaleX(" + amount + ")";
      if (amount >= 1) {
        progress.classList.add("is-hidden");
      }
    });

    viewer.addEventListener("load", () => {
      progress.classList.add("is-hidden");
    });

    let userInteracted = false;

    function syncHint() {
      const hideForPanel = window.matchMedia("(max-width: 799px)").matches && specs.open;
      hint.classList.toggle("is-hidden", userInteracted || hideForPanel);
    }

    viewer.addEventListener("camera-change", (event) => {
      if (event.detail.source === "user-interaction") {
        userInteracted = true;
        viewer.autoRotate = false;
        syncHint();
      }
    });

    document.getElementById("reset").addEventListener("click", () => {
      userInteracted = false;
      viewer.cameraOrbit = defaultOrbit();
      viewer.fieldOfView = DEFAULT_FOV;
      viewer.cameraTarget = "auto auto auto";
      viewer.jumpCameraToGoal();
      viewer.autoRotate = true;
      syncHint();
    });

    specs.addEventListener("toggle", syncHint);
    syncHint();
  </script>
</body>
</html>
