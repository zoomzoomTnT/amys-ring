<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Amy's Ring</title>
    <style>
    :root {
      --bg: #ffffff;
      --ink: #1d1c1a;
      --muted: #85827c;
      --line: rgba(29, 28, 26, 0.12);
      --panel: rgba(255, 255, 255, 0.9);
      --serif: "Didot", "Bodoni 72", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --safe-top: max(14px, env(safe-area-inset-top));
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
      --safe-left: max(16px, env(safe-area-inset-left));
      --safe-right: max(16px, env(safe-area-inset-right));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans);
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); }
    button { font: inherit; color: inherit; }

    header { text-align: center; flex-shrink: 0; padding-top: 4px; }
    #site-title { font-family: var(--serif); font-weight: 300; font-size: clamp(1.1rem, 4.4vw, 1.6rem);
      letter-spacing: 0.32em; text-transform: uppercase; line-height: 1.2; margin-right: -0.32em; }
    .subtitle { margin-top: 0.4rem; font-family: var(--serif); font-style: italic; font-size: 0.78rem;
      color: var(--muted); letter-spacing: 0.06em; }

    .stage { position: relative; flex: 1; min-height: 0; margin: 0.5rem calc(-1 * var(--safe-left)) 0; }
    #viewer, .still { position: absolute; inset: 0; }
    #viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    .still { display: none; align-items: center; justify-content: center; flex-direction: column;
      padding: 0 var(--safe-left); cursor: zoom-in; background: var(--bg); border: 0; width: 100%; }
    .still img { max-width: 100%; max-height: calc(100% - 1.6rem); object-fit: contain; }
    .still figcaption, .lb-cap { margin-top: 0.5rem; font-family: var(--serif); font-style: italic; font-size: 0.72rem;
      color: var(--muted); letter-spacing: 0.08em; min-height: 1em; }
    .stage[data-mode="image"] #viewer { visibility: hidden; }
    .stage[data-mode="image"] .still { display: flex; }

    .hint { position: absolute; left: 50%; bottom: 0.4rem; transform: translateX(-50%);
      font-family: var(--serif); font-style: italic; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--muted);
      white-space: nowrap; pointer-events: none; transition: opacity 0.4s ease; }
    .hint.is-hidden, .stage[data-mode="image"] .hint { opacity: 0; }

    .progress { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
      width: min(9.5rem, 46vw); pointer-events: none; transition: opacity 0.35s ease, visibility 0.35s ease; }
    .progress.is-hidden { opacity: 0; visibility: hidden; }
    .progress-label { display: block; text-align: center; font-size: 0.62rem; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }
    .progress-track { height: 1px; background: var(--line); overflow: hidden; }
    .progress-fill { height: 100%; width: 100%; background: var(--ink); transform: scaleX(0);
      transform-origin: left center; transition: transform 0.16s linear; }

    /* gallery strip */
    .strip { flex-shrink: 0; display: flex; gap: 0.7rem; overflow-x: auto; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 0.7rem 0.1rem 0.6rem;
      justify-content: safe center; }
    .strip::-webkit-scrollbar { display: none; }
    .thumb { appearance: none; background: none; border: 0; cursor: pointer; flex: 0 0 auto; scroll-snap-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 0.4rem; width: 4.6rem; }
    .thumb .frame { width: 4.6rem; height: 4.6rem; border: 1px solid var(--line); display: flex; align-items: center;
      justify-content: center; overflow: hidden; background: #fafafa; transition: border-color 0.25s ease; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb .three-d { font-family: var(--serif); font-size: 1.15rem; letter-spacing: 0.12em; font-weight: 300; }
    .thumb .label { font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
      white-space: nowrap; padding-bottom: 3px; border-bottom: 1px solid transparent; transition: color .25s, border-color .25s; }
    .thumb[aria-selected="true"] .frame { border-color: var(--ink); }
    .thumb[aria-selected="true"] .label { color: var(--ink); border-bottom-color: var(--ink); }
    .thumb:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

    /* details + reset */
    .chrome { flex-shrink: 0; position: relative; display: flex; align-items: flex-end; gap: 0.55rem; }
    #reset { appearance: none; flex-shrink: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 0;
      padding: 0.72rem 0.95rem; font: 400 0.62rem/1 var(--sans); letter-spacing: 0.22em; text-transform: uppercase;
      cursor: pointer; white-space: nowrap; }
    #reset[hidden] { display: none; }
    #reset:hover { border-color: var(--ink); }
    .specs { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .specs[open] { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; }
    .specs summary { list-style: none; cursor: pointer; padding: 0.72rem 0.95rem; font-size: 0.62rem; font-weight: 400;
      letter-spacing: 0.22em; text-transform: uppercase; display: flex; align-items: center;
      justify-content: space-between; gap: 0.75rem; user-select: none; }
    .specs summary::-webkit-details-marker { display: none; }
    .specs summary::after { content: "+"; font-size: 0.95rem; line-height: 1; font-weight: 300; }
    .specs[open] summary::after { content: "\2212"; }
    .specs summary:focus-visible { outline: 1px solid var(--ink); outline-offset: -2px; }
    .spec-body { border-top: 1px solid var(--line); padding: 0.85rem 0.95rem 1rem; }
    .spec-body dl { display: grid; grid-template-columns: auto 1fr; gap: 0.55rem 1.1rem; font-size: 0.8rem; line-height: 1.4; }
    .spec-body dt { font-family: var(--serif); font-style: italic; color: var(--muted); white-space: nowrap; letter-spacing: 0.03em; }
    .spec-body dd { font-weight: 300; }

    /* lightbox */
    .lightbox { position: fixed; inset: 0; z-index: 10; background: #fff; display: none; flex-direction: column; }
    .lightbox.is-open { display: flex; }
    .lb-top { display: flex; align-items: center; justify-content: space-between;
      padding: var(--safe-top) var(--safe-right) 0.5rem var(--safe-left); font-size: 0.62rem; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--muted); }
    .lb-close { appearance: none; background: none; border: 0; font-size: 1.7rem; font-weight: 200; line-height: 1;
      cursor: pointer; padding: 0.2rem 0.4rem; color: var(--ink); }
    .lb-track { flex: 1; min-height: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      scrollbar-width: none; overscroll-behavior: contain; }
    .lb-track::-webkit-scrollbar { display: none; }
    .lb-slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 0 var(--safe-left) var(--safe-bottom); }
    .lb-slide img { max-width: 100%; max-height: calc(100% - 2.2rem); object-fit: contain; }
    .lb-title { font-family: var(--serif); letter-spacing: 0.2em; }

    @media (min-width: 800px) {
      #site-title { letter-spacing: 0.4em; }
      .subtitle { font-size: 0.85rem; }
      .thumb, .thumb .frame { width: 5.2rem; } .thumb .frame { height: 5.2rem; }
      .chrome { justify-content: space-between; }
      .specs { flex: 0 1 26rem; }
      .specs[open] { right: auto; width: 26rem; }
      .spec-body dl { font-size: 0.84rem; }
      .lb-track { cursor: default; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="site-title">Amy's Ring</h1>
    <p class="subtitle">18K white gold &middot; 15.68 ct oval</p>
  </header>

  <main class="stage" id="stage" data-mode="3d">
    <div id="viewer" aria-label="Interactive 3D ring"></div>
    <figure class="still" id="still" role="button" tabindex="0" aria-label="Open full screen">
      <img id="still-img" alt="">
      <figcaption id="still-cap"></figcaption>
    </figure>
    <div class="progress" id="progress">
      <span class="progress-label">Loading</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <p class="hint" id="hint">Drag to rotate &middot; pinch to zoom</p>
  </main>

  <nav class="strip" id="strip" role="tablist" aria-label="Views">
    <button class="thumb" role="tab" aria-selected="true" data-kind="3d">
      <span class="frame"><span class="three-d">3D</span></span><span class="label">3D</span>
    </button>
    <button class="thumb" role="tab" aria-selected="false" data-kind="image" data-index="0">
      <span class="frame"><img src="./gallery/front_thumb.webp" alt="" loading="lazy"></span><span class="label">Front view</span>
    </button>
    <button class="thumb" role="tab" aria-selected="false" data-kind="image" data-index="1">
      <span class="frame"><img src="./gallery/top_thumb.webp" alt="" loading="lazy"></span><span class="label">Top view</span>
    </button>
    <button class="thumb" role="tab" aria-selected="false" data-kind="image" data-index="2">
      <span class="frame"><img src="./gallery/on_hand_thumb.webp" alt="" loading="lazy"></span><span class="label">On hand</span>
    </button>
  </nav>

  <footer class="chrome">
    <details class="specs" id="specs">
      <summary>Details</summary>
      <div class="spec-body">
        <dl>
          <dt>Metal</dt>
          <dd>18K White Gold</dd>
          <dt>Weight</dt>
          <dd>approx. 8.2 g</dd>
          <dt>Size</dt>
          <dd>5.5</dd>
          <dt>Center</dt>
          <dd>15.68 ct lab-grown oval, D color, VVS1, IGI LG843655695</dd>
          <dt>Accents</dt>
          <dd>approx. 4.35 ct total</dd>
        </dl>
      </div>
    </details>
    <button type="button" id="reset">Reset view</button>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Gallery">
    <div class="lb-top"><span id="lb-count">1 / 3</span><button class="lb-close" id="lb-close" aria-label="Close">&times;</button></div>
    <div class="lb-track" id="lb-track"></div>
  </div>

  <script type="module">
    import { startViewer } from "./viewer.js";

    // One easy-to-edit title. Change this string only.
    const SITE_TITLE = "Amy's Ring";
    const IMAGES = [
      { src: "./gallery/front.webp", title: "Front view", caption: "" },
      { src: "./gallery/top.webp", title: "Top view", caption: "" },
      { src: "./gallery/on_hand.webp", title: "On hand", caption: "Illustration" },
    ];

    document.getElementById("site-title").textContent = SITE_TITLE;
    document.title = SITE_TITLE;

    const $ = (id) => document.getElementById(id);
    const stage = $("stage"), progress = $("progress"), progressFill = $("progress-fill");
    const hint = $("hint"), specs = $("specs"), resetBtn = $("reset");
    let userInteracted = false, current = -1;

    const viewer = startViewer({
      container: $("viewer"),
      src: "./ring.glb",
      onProgress: (a) => { progressFill.style.transform = "scaleX(" + a + ")"; },
      onLoad: () => progress.classList.add("is-hidden"),
      onInteract: () => { userInteracted = true; syncHint(); },
    });

    function syncHint() {
      const hideForPanel = window.matchMedia("(max-width: 799px)").matches && specs.open;
      hint.classList.toggle("is-hidden", userInteracted || hideForPanel);
    }
    if (window.matchMedia("(min-width: 800px)").matches) specs.open = true;
    specs.addEventListener("toggle", syncHint);
    syncHint();

    resetBtn.addEventListener("click", () => { userInteracted = false; viewer.reset(); syncHint(); });

    // ---- gallery strip
    const thumbs = [...document.querySelectorAll(".thumb")];
    function select(btn) {
      thumbs.forEach((t) => t.setAttribute("aria-selected", String(t === btn)));
      btn.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
      if (btn.dataset.kind === "3d") {
        stage.dataset.mode = "3d"; resetBtn.hidden = false; viewer.pause(false); current = -1;
      } else {
        current = +btn.dataset.index;
        const im = IMAGES[current];
        $("still-img").src = im.src; $("still-img").alt = im.title;
        $("still-cap").textContent = im.caption;
        stage.dataset.mode = "image"; resetBtn.hidden = true; viewer.pause(true);
      }
    }
    thumbs.forEach((t) => t.addEventListener("click", () => select(t)));

    // ---- lightbox (swipe between photos, scroll-snap)
    const lb = $("lightbox"), track = $("lb-track");
    track.innerHTML = IMAGES.map((im) =>
      '<figure class="lb-slide"><img src="' + im.src + '" alt="' + im.title + '" loading="lazy">' +
      '<figcaption class="lb-cap"><span class="lb-title">' + im.title.toUpperCase() + '</span>' +
      (im.caption ? ' &middot; ' + im.caption : '') + '</figcaption></figure>').join("");
    function openLb(i) {
      lb.classList.add("is-open");
      track.scrollLeft = i * track.clientWidth;
      $("lb-count").textContent = (i + 1) + " / " + IMAGES.length;
    }
    track.addEventListener("scroll", () => {
      const i = Math.round(track.scrollLeft / track.clientWidth);
      $("lb-count").textContent = (i + 1) + " / " + IMAGES.length;
    }, { passive: true });
    $("still").addEventListener("click", () => openLb(current));
    $("still").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") openLb(current); });
    $("lb-close").addEventListener("click", () => lb.classList.remove("is-open"));
    document.addEventListener("keydown", (e) => {
      if (!lb.classList.contains("is-open")) return;
      if (e.key === "Escape") lb.classList.remove("is-open");
      if (e.key === "ArrowRight") track.scrollBy({ left: track.clientWidth, behavior: "smooth" });
      if (e.key === "ArrowLeft") track.scrollBy({ left: -track.clientWidth, behavior: "smooth" });
    });
    if (location.hash === "#lightbox") openLb(0);
    const m = location.hash.match(/^#view=(\d)$/); if (m) select(thumbs[+m[1]]);
  </script>
</body>
</html>
